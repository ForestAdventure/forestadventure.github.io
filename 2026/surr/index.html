    function toHHMMSS(value, allowOver24 = true) {
        if (value === 0) {
            return '00:00:00'
        }
        if (!value) return '';

        const milliseconds = Math.floor(value % 1000);

        value /= 1000;

        let hours = Math.floor(value / 3600);
        const remainingSeconds = value % 3600;
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = Math.floor(remainingSeconds % 60);

        if (!allowOver24) {
            hours = hours % 24;
        }

        var with0 = function (dd) {
            return (dd < 10 ? '0' + dd : dd) + '';
        };

        let result = with0(hours) + ':' + with0(minutes) + ':' + with0(seconds);

        if (milliseconds > 0) {
            const fraction = String(milliseconds).padStart(3, '0').replace(/0+$/, '');
            result += '.' + fraction;
        }

        return result;
    }
